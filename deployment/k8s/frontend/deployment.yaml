apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: teachua
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports: [{ containerPort: 80 }]
        volumeMounts:
        - { name: www,  mountPath: /usr/share/nginx/html }
        - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
      - name: www
        hostPath:
          path: /home/ubuntu/teachua-project/deployment/frontend-build
          type: DirectoryOrCreate
      - name: conf
        configMap:
          name: teachua-frontend-conf
