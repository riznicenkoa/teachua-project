apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: teachua
spec:
  selector: { matchLabels: { app: promtail } }
  template:
    metadata: { labels: { app: promtail } }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.3
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports: [{ containerPort: 9080, name: http }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/promtail }
            - { name: p,   mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits:   { memory: 96Mi, cpu: 80m }
      volumes:
        - name: cfg
          configMap: { name: promtail-config }
        - name: p
          hostPath: { path: /var/log/pods }
      tolerations:
        - operator: Exists
