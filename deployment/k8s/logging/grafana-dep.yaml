apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: teachua
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini }
            - { name: cfg, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 192Mi, cpu: 200m }
      volumes:
        - name: cfg
          configMap: { name: grafana-config }
