apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: teachua
spec:
  replicas: 1
  serviceName: loki
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.3
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ containerPort: 3100, name: http }]
          volumeMounts:
            - { name: cfg,  mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 256Mi, cpu: 200m }
      volumes:
        - name: cfg
          configMap: { name: loki-config }
        - name: data
          hostPath: { path: /var/lib/loki, type: DirectoryOrCreate }
