apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: teachua
  labels: { app: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.55
          args: ["--collector.otlp.enabled=true"]
          ports:
            - { containerPort: 16686, name: ui }
            - { containerPort: 14250, name: model }
            - { containerPort: 14268, name: collector-http }
            - { containerPort: 4317,  name: otlp-grpc }
            - { containerPort: 4318,  name: otlp-http }
          env:
            - { name: COLLECTOR_OTLP_ENABLED,        value: "true" }
            - { name: JAEGER_DISABLED,              value: "false" }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 256Mi, cpu: 200m }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: teachua
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui,           port: 16686, targetPort: 16686 }
    - { name: otlp-grpc,    port: 4317,  targetPort: 4317 }
    - { name: otlp-http,    port: 4318,  targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: teachua
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { port: 16686, targetPort: 16686, nodePort: 30031 }
