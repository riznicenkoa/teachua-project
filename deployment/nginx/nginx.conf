worker_processes  1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 16m;

  upstream teachua_backend { server backend:8080; }

  server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # React: всё, что не /api/ — отдаём статикой
    location / {
      try_files $uri $uri/ /index.html;
    }

    # статические JS/CSS из подпапки /static/ (опционально)
    location /static/ { root /usr/share/nginx/html; }

    # всё, что начинается с /api/ — проксируем на Spring
    location /api/ {
      proxy_pass http://teachua_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
