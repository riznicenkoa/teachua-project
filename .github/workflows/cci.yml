name: TeachUA CCI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: ./deployment/backend }
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      - name: Maven verify (compile + unit tests)
        run: mvn -B -q -e verify -Dspring.profiles.active=test

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run: { working-directory: ./deployment/frontend }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint --if-present
      - name: Build (smoke check)
        env:
          CI: 'false'
          REACT_APP_ROOT_SERVER: http://localhost:30080
        run: NODE_OPTIONS="--openssl-legacy-provider" npm run build
