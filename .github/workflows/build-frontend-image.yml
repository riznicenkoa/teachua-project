name: Frontend Image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./deployment/frontend
          push: true
          build-args: |
            REACT_APP_ROOT_SERVER=http://13.61.140.167:30080
          tags: |
            ghcr.io/riznicenkoa/teachua-frontend:1
            ghcr.io/riznicenkoa/teachua-frontend:dev
